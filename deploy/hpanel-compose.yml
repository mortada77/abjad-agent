# =====================================================================
# Abjad Agi — Compose file to PASTE into Hostinger hPanel:
#   VPS -> Docker Manager -> Compose
# It builds the image straight from the GitHub repo (no terminal, no
# file upload needed). Fill the two secrets marked >>> before deploying.
#
# NOTE: __REPO_URL__ is replaced with the real GitHub URL before use.
# =====================================================================
name: abjad-agent

services:
  abjad-agent:
    build:
      context: __REPO_URL__#main
    image: abjad-agent:latest
    container_name: abjad-agent
    restart: unless-stopped
    ports:
      - "47850:47850"
    environment:
      # ---- AI provider ----
      AI_PROVIDER: anthropic
      # >>> PASTE YOUR REAL ANTHROPIC API KEY HERE:
      ANTHROPIC_API_KEY: ""
      ANTHROPIC_MODEL: claude-opus-5
      # (only if AI_PROVIDER=openai)
      OPENAI_API_KEY: ""
      OPENAI_MODEL: gpt-4o-mini
      # ---- AI limits ----
      AI_MAX_TOKENS: "700"
      AI_TIMEOUT_MS: "45000"
      AI_MAX_RETRIES: "2"
      AI_MAX_CONCURRENCY: "3"
      # ---- Conversation memory ----
      MAX_HISTORY_MESSAGES: "12"
      SUMMARY_TRIGGER_MESSAGES: "30"
      # ---- Human takeover ----
      HUMAN_TAKEOVER_MINUTES: "30"
      # ---- WhatsApp ----
      IGNORE_GROUPS: "true"
      DEBOUNCE_MS: "2500"
      # ---- Health / QR server ----
      PORT: "47850"
      # >>> SET A RANDOM STRING HERE (used to open the QR page):
      PAIRING_TOKEN: "change-me-to-a-random-string"
      # ---- Logging ----
      LOG_LEVEL: info
      NODE_ENV: production
    volumes:
      - abjad_auth:/app/whatsapp-auth
      - abjad_data:/app/data
      - abjad_logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  abjad_auth:
  abjad_data:
  abjad_logs:
