# =====================================================================
# Abjad Agi — PASTE THIS into Hostinger hPanel:
#   VPS -> Docker Manager -> Compose (Create / New compose project)
# Builds the image straight from GitHub. No terminal, no file upload.
# Fill the ONE line marked >>> with your OpenAI API key before deploy.
# =====================================================================
name: abjad-agent

services:
  abjad-agent:
    # Prebuilt image published by GitHub Actions (hPanel pulls it, no build).
    image: ghcr.io/mortada77/abjad-agent:latest
    pull_policy: always          # always pull the newest image on redeploy
    container_name: abjad-agent
    restart: unless-stopped
    ports:
      - "47850:47850"
    environment:
      # ---- AI provider ----
      AI_PROVIDER: openai
      # >>> PASTE YOUR OpenAI API KEY (starts with sk-...) between the quotes:
      OPENAI_API_KEY: ""
      OPENAI_MODEL: gpt-5.5         # premium customer-facing and executive quality
      # (Anthropic left empty; switch AI_PROVIDER to "anthropic" to use it)
      ANTHROPIC_API_KEY: ""
      ANTHROPIC_MODEL: claude-opus-5
      # >>> YOUR personal WhatsApp number for escalation alerts (digits, country code, NO +):
      ADMIN_NUMBER: ""
      # ---- AI limits (keep cost low) ----
      AI_MAX_TOKENS: "700"
      AI_TIMEOUT_MS: "45000"
      AI_MAX_RETRIES: "2"
      AI_MAX_CONCURRENCY: "3"
      # ---- Conversation memory ----
      MAX_HISTORY_MESSAGES: "12"
      SUMMARY_TRIGGER_MESSAGES: "30"
      # ---- Human takeover ----
      HUMAN_TAKEOVER_MINUTES: "30"
      # ---- WhatsApp ----
      IGNORE_GROUPS: "true"
      DEBOUNCE_MS: "2500"
      # ---- Health / QR server ----
      PORT: "47850"
      PAIRING_TOKEN: "4dd2cd30ea4bc7608fada571"
      # ---- Logging ----
      LOG_LEVEL: info
      NODE_ENV: production
    volumes:
      - abjad_auth2:/app/whatsapp-auth
      - abjad_data:/app/data
      - abjad_logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  abjad_auth2:
  abjad_data:
  abjad_logs:
